<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>🌸 粉色围棋棋盘 ❄️</title><style>*{box-sizing:border-box;}html,body{margin:0;padding:0;min-height:100%;font-family:'Comic Sans MS','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(160deg,#ffe3ef 0%,#ffd0e4 40%,#fcc7dd 70%,#ffeaf4 100%);color:#b34a78;overflow-x:hidden;}.snow-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}.snowflake{position:absolute;top:-10vh;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.9),0 0 3px #ffb3d1;opacity:.85;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite;}@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg);}100%{transform:translateY(115vh) rotate(360deg);}}.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:24px 16px 60px;text-align:center;}h1{font-size:28px;margin:6px 0 4px;color:#e0559a;text-shadow:2px 2px 0 #fff,0 0 12px rgba(255,150,190,.7);}.subtitle{font-size:14px;color:#d17aa6;margin-bottom:18px;}.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px;}button{font-family:inherit;font-size:15px;font-weight:bold;padding:9px 18px;border-radius:20px;border:2px solid #ffa6cc;background:linear-gradient(180deg,#fff,#ffe1ee);color:#d24b8c;cursor:pointer;box-shadow:0 4px 0 #ffc3dd,0 6px 12px rgba(255,140,185,.3);transition:all .12s ease;}button:hover{transform:translateY(-2px);box-shadow:0 6px 0 #ffc3dd,0 8px 16px rgba(255,140,185,.4);}button:active{transform:translateY(2px);box-shadow:0 2px 0 #ffc3dd;}button.active{background:linear-gradient(180deg,#ff9ec9,#ff6fb0);color:#fff;border-color:#ff6fb0;box-shadow:0 4px 0 #e04e93;}.board-frame{display:inline-block;padding:16px;border-radius:26px;background:linear-gradient(145deg,#ffc9e0,#ff9ec9);box-shadow:0 10px 30px rgba(214,80,140,.35),inset 0 0 0 4px rgba(255,255,255,.5);position:relative;}.deco{position:absolute;font-size:20px;opacity:.9;pointer-events:none;filter:drop-shadow(0 0 4px #fff);}canvas{display:block;border-radius:16px;background:#ffe6f0;cursor:pointer;box-shadow:inset 0 0 24px rgba(255,150,190,.35);}.status{margin-top:16px;font-size:16px;font-weight:bold;color:#c93f83;display:flex;align-items:center;justify-content:center;gap:10px;}.dot{display:inline-block;width:18px;height:18px;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2);}.dot.black{background:radial-gradient(circle at 33% 30%,#6b6b6b,#111);}.dot.white{background:radial-gradient(circle at 33% 30%,#fff,#d9c2cd);border:1px solid #e2a9c6;}.hint{margin-top:8px;font-size:12px;color:#d98cb2;}</style></head><body><div class='snow-layer' id='snowLayer'></div><div class='wrap'><h1>🌸 粉色围棋棋盘 ❄️</h1><div class='subtitle'>点击交叉点落子 · 黑先白后 · 雪花陪你对弈 ♡</div><div class='controls'><button data-size='19' class='active'>19 路</button><button data-size='13'>13 路</button><button data-size='9'>9 路</button><button id='undoBtn'>↩︎ 悔棋</button><button id='clearBtn'>🧹 清空</button></div><div class='board-frame'><span class='deco' style='top:6px;left:10px;'>❄️</span><span class='deco' style='top:6px;right:10px;'>🌸</span><span class='deco' style='bottom:6px;left:10px;'>🌸</span><span class='deco' style='bottom:6px;right:10px;'>❄️</span><canvas id='board'></canvas></div><div class='status'><span>当前执子：</span><span id='turnDot' class='dot black'></span><span id='turnText'>黑棋</span></div><div class='hint' id='hint'>已落子：0 手</div></div><script>(function(){var canvas=document.getElementById('board');var ctx=canvas.getContext('2d');var turnDot=document.getElementById('turnDot');var turnText=document.getElementById('turnText');var hintEl=document.getElementById('hint');var dpr=Math.max(1,Math.min(window.devicePixelRatio||1,2));var N=19,cell=30,pad=34,stones=[],history=[],current='black';var starMap={19:[[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]],13:[[3,3],[3,9],[9,3],[9,9],[6,6]],9:[[2,2],[2,6],[6,2],[6,6],[4,4]]};function setup(size){N=size;stones=[];for(var r=0;r<N;r++){stones.push(new Array(N).fill(null));}history=[];current='black';layout();updateStatus();draw();}function layout(){var avail=Math.min(window.innerWidth-96,600);cell=Math.max(14,avail/(N+1.4));pad=cell*1.05;var size=cell*(N-1)+2*pad;canvas.style.width=size+'px';canvas.style.height=size+'px';canvas.width=Math.round(size*dpr);canvas.height=Math.round(size*dpr);}function px(i){return pad+i*cell;}function draw(){var size=canvas.width/dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,size,size);var g=ctx.createLinearGradient(0,0,size,size);g.addColorStop(0,'#fff0f7');g.addColorStop(1,'#ffdcea');ctx.fillStyle=g;ctx.fillRect(0,0,size,size);ctx.strokeStyle='#ff9ec4';ctx.lineWidth=1;ctx.beginPath();for(var i=0;i<N;i++){ctx.moveTo(px(0),px(i));ctx.lineTo(px(N-1),px(i));ctx.moveTo(px(i),px(0));ctx.lineTo(px(i),px(N-1));}ctx.stroke();ctx.strokeStyle='#f77bb0';ctx.lineWidth=2;ctx.strokeRect(px(0),px(0),px(N-1)-px(0),px(N-1)-px(0));var stars=starMap[N]||[];ctx.fillStyle='#f77bb0';for(var s=0;s<stars.length;s++){ctx.beginPath();ctx.arc(px(stars[s][0]),px(stars[s][1]),Math.max(2,cell*0.08),0,Math.PI*2);ctx.fill();}var rr=cell*0.44;for(var r2=0;r2<N;r2++){for(var c2=0;c2<N;c2++){var v=stones[r2][c2];if(!v){continue;}var x=px(c2),y=px(r2);ctx.beginPath();ctx.arc(x,y+2,rr,0,Math.PI*2);ctx.fillStyle='rgba(180,90,130,0.25)';ctx.fill();var grad=ctx.createRadialGradient(x-rr*0.35,y-rr*0.4,rr*0.15,x,y,rr);if(v==='black'){grad.addColorStop(0,'#7a7a7a');grad.addColorStop(0.55,'#2a2a2a');grad.addColorStop(1,'#000000');}else{grad.addColorStop(0,'#ffffff');grad.addColorStop(0.7,'#fff6fb');grad.addColorStop(1,'#e6c6d6');}ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=(v==='black')?'rgba(255,180,210,0.55)':'rgba(230,150,190,0.9)';ctx.stroke();}}}function updateStatus(){turnDot.className='dot '+current;turnText.textContent=(current==='black')?'黑棋':'白棋';hintEl.textContent='已落子：'+history.length+' 手';}canvas.addEventListener('click',function(e){var rect=canvas.getBoundingClientRect();var x=e.clientX-rect.left;var y=e.clientY-rect.top;var c=Math.round((x-pad)/cell);var r=Math.round((y-pad)/cell);if(r<0||r>=N||c<0||c>=N){return;}if(Math.hypot(x-px(c),y-px(r))>cell*0.55){return;}if(stones[r][c]){return;}stones[r][c]=current;history.push({r:r,c:c,color:current});current=(current==='black')?'white':'black';updateStatus();draw();});document.getElementById('undoBtn').addEventListener('click',function(){var last=history.pop();if(!last){return;}stones[last.r][last.c]=null;current=last.color;updateStatus();draw();});document.getElementById('clearBtn').addEventListener('click',function(){for(var r=0;r<N;r++){for(var c=0;c<N;c++){stones[r][c]=null;}}history=[];current='black';updateStatus();draw();});var sizeBtns=document.querySelectorAll('button[data-size]');Array.prototype.forEach.call(sizeBtns,function(b){b.addEventListener('click',function(){Array.prototype.forEach.call(sizeBtns,function(x){x.classList.remove('active');});b.classList.add('active');setup(parseInt(b.getAttribute('data-size'),10));});});window.addEventListener('resize',function(){layout();draw();});var layer=document.getElementById('snowLayer');var glyphs=['❄','❅','❆','✻','✼','🌸'];for(var k=0;k<28;k++){var s2=document.createElement('span');s2.className='snowflake';s2.textContent=glyphs[k%glyphs.length];s2.style.left=(Math.random()*100)+'vw';s2.style.fontSize=(8+Math.random()*16)+'px';s2.style.animationDuration=(7+Math.random()*10)+'s';s2.style.animationDelay=(-Math.random()*12)+'s';s2.style.opacity=(0.45+Math.random()*0.5).toFixed(2);layer.appendChild(s2);}setup(19);})();</script></body></html>

[project]
name = "yukiv6"
version = "1.0.0"
description = "YukiV6 (FrostFrame) - Asynchronous QQ AI Assistant based on OneBot 11 / NapCat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "certifi>=2024.0.0",
    "chromadb>=1.0.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.25.0",
    "jieba>=0.42.1",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "opencv-python>=4.9.0",
    "orjson>=3.10.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "qrcode>=7.4",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "safetensors>=0.4.3",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "sentence-transformers>=3.0.0",
    "tenacity>=8.2.0",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "uvicorn>=0.30.0",
    "websocket-client>=1.7.0",
    "websockets>=12.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
# 套件必须全离线：不联网、不需要真实 API Key，随时可跑
asyncio_mode = "auto"
testpaths = ["tests"]

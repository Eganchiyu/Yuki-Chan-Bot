name: 功能请求
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议。请详细描述你的需求，以便我们评估和规划。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 描述你遇到的问题或痛点，说明为什么需要这个功能
      placeholder: 例如: 当我在使用 ... 功能时，发现 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你期望的解决方案或功能行为
      placeholder: 描述你希望这个功能如何工作...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的其他替代方案
      placeholder: 你是否考虑过其他实现方式？

  - type: dropdown
    id: category
    attributes:
      label: 功能分类
      description: 这个功能属于哪个类别
      options:
        - 新模块/新功能
        - 现有功能增强
        - 用户体验改进
        - 性能优化
        - 开发工具/调试
        - 文档完善
        - 其他
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      description: 这个功能涉及的模块
      multiple: true
      options:
        - core (核心引擎)
        - modules (功能模块)
        - providers (模型提供商)
        - network (网络通信)
        - configs (配置)
        - memory (记忆系统)
        - message (消息处理)
        - vision (视觉处理)
        - stickers (贴纸管理)
        - utils (工具函数)
        - 新模块
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 重要程度
      description: 你认为这个功能的重要程度
      options:
        - 关键: 严重影响使用，没有替代方案
        - 重要: 明显影响体验，有临时替代方案
        - 一般: 有改善但不影响核心使用
        - 低: 锦上添花
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: 实现思路
      description: 如果你有具体的实现思路，请在此描述
      placeholder: 你对实现这个功能有什么想法？

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他相关信息（如参考资料、截图、使用场景等）
      placeholder: 添加任何其他相关信息...
